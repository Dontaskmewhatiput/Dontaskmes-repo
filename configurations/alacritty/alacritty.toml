# This will make alacritty transparent
# and remove the window effects

[font]
size = 13

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[window]
opacity = 0.8
decorations = "none"

[window.dimensions]
columns = 100
lines=30

[env]
TERM= "xterm-256color"

[colors.bright]
black   = "#444b6a"
blue    = "#7da6ff"
cyan    = "#0db9d7"
green   = "#b9f27c"
magenta = "#bb9af7"
red     = "#ff7a93"
white   = "#acb0d0"
yellow  = "#ff9e64"


[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[terminal.shell]
program = "/usr/bin/tmux"
args = ["new-session", "-A", "-D", "-s", "main"]




